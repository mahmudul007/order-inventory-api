services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: order-inventory-app:latest
    container_name: order_inventory_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - order_inventory_net
    depends_on:
      - mysql
      - redis

  web:
    image: nginx:alpine
    container_name: order_inventory_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - order_inventory_net
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: order_inventory_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: order_inventory
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - order_inventory_net

  redis:
    image: redis:alpine
    container_name: order_inventory_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - order_inventory_net

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_inventory_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: php artisan queue:work --tries=3 --timeout=90
    networks:
      - order_inventory_net
    depends_on:
      - app
      - mysql
      - redis

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order_inventory_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: php artisan schedule:work
    networks:
      - order_inventory_net
    depends_on:
      - app
      - mysql
      - redis

networks:
  order_inventory_net:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

